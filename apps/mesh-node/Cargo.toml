[package]
name = "mesh-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MonkeyMesh local node (chain + P2P)"

[[bin]]
name = "mesh-node"
path = "src/main.rs"

[dependencies]
mesh-types = { workspace = true }
mesh-crypto = { workspace = true }
mesh-chain = { workspace = true }
mesh-p2p = { workspace = true }
mesh-rpc = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
ureq = { version = "2", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
bincode = { workspace = true }
